name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install core dependencies
        run: npm ci

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Check core
        run: npm run check && npm test

      - name: Check web
        working-directory: web
        run: npx tsc --noEmit && npm run lint

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Verify static export
        working-directory: web
        run: |
          node --test tests/rendered-html.test.mjs
          test -f dist/client/index.html
          test -d "dist/client/${GITHUB_REPOSITORY#*/}/_next/static"
          grep -q "/${GITHUB_REPOSITORY#*/}/_next/static" dist/client/index.html
          if grep -R -E '/api/(chart|places|narrative)' dist/client; then
            echo "::error::Static bundle still references a removed HTTP API."
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch web/dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
